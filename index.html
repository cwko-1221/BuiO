<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Keep a retry available even while a deferred script is still downloading.
      setTimeout(() => {
        const retry = document.getElementById('hub-boot-retry');
        if (!retry) return;
        retry.hidden = false;
        window.BuiLoading?.ready();
        retry.addEventListener('click', () => {
          retry.disabled = true;
          setTimeout(() => { retry.disabled = false; }, 3000);
          window.stop();
          const url = new URL(location.href);
          url.searchParams.set('_reload', Date.now());
          location.replace(url);
        });
      }, 10000);
    </script>
