name: BuiO iOS pilot compile

on:
  workflow_dispatch:
  push:
    branches: [codex/capacitor-ios-pilot]
    paths:
      - mobile-app/**
      - .github/workflows/buio-ios-pilot.yml

permissions:
  contents: read

concurrency:
  group: buio-ios-pilot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    name: Compile iOS without signing
    runs-on: macos-15
    timeout-minutes: 25
    defaults:
      run:
        working-directory: mobile-app
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: mobile-app
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Select installed Xcode 26 or newer
        run: node ci/select-xcode.mjs
      - name: Install mobile dependencies only
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Prepare and validate the app
        run: |
          npm run prepare:app
          npx cap sync ios
          npm test
      - name: Compile actual iOS simulator target
        id: compile
        run: node scripts/ios-simulator.mjs
      - name: Build unsigned IPA for physical iPhone and iPad
        id: device
        run: node scripts/ios-device.mjs
      - name: Save unsigned IPA for personal signing on Windows
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: buio-ios-device-unsigned
          path: |
            mobile-app/releases/*-unsigned.ipa
            mobile-app/releases/*.ipa.sha256
            mobile-app/releases/device-build.json
          if-no-files-found: error
          retention-days: 1
      - name: Record result
        if: always()
        env:
          BUILD_RESULT: ${{ steps.compile.outcome }}
          DEVICE_RESULT: ${{ steps.device.outcome }}
        run: |
          {
            echo '### BuiO iOS native compilation'
            echo "Compilation outcome: ${BUILD_RESULT}"
            echo "Physical-device unsigned IPA outcome: ${DEVICE_RESULT}"
            echo 'The device IPA requires personal signing before installation; it is not directly installable or a TestFlight build.'
            echo 'This workflow does not contain Apple credentials, sign apps, upload to Apple, or invite testers.'
          } >> "$GITHUB_STEP_SUMMARY"

