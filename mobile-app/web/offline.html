<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src https: http://localhost:* http://127.0.0.1:*; base-uri 'none'; form-action 'none'">
  <title>杯澳學習平台</title>
  <link rel="stylesheet" href="offline.css">
  <script src="settings.js" defer></script>
  <script src="offline.js" defer></script>
</head>
<body>
  <main>
    <div class="brand"><span class="brand-mark" aria-hidden="true">B</span><span>杯澳學習平台<small>BUI O LEARNING</small></span></div>
    <div class="connection-art" aria-hidden="true"><span></span><span></span><span></span><i></i></div>
    <p class="eyebrow">學習，隨時繼續</p>
    <h1>暫時未能連接平台</h1>
    <p class="description">請檢查 Wi-Fi 或流動網絡，然後再試一次。<br>平台回復連線後，便可繼續使用。</p>
    <button id="retry" type="button">重新連接 <span aria-hidden="true">↗</span></button>
    <p id="status" role="status" aria-live="polite">正在檢查連線…</p>
    <p class="footnote">無須重新安裝 App</p>
  </main>
</body>
</html>
