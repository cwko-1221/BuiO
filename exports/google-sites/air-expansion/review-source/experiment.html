:root {
  --ink: #102e38;
  --ink-soft: #4d6870;
  --deep: #082f3d;
  --deep-2: #0b4550;
  --paper: #fffdf7;
  --cream: #f7f1e3;
  --mint: #5ae0b8;
  --mint-deep: #168c78;
  --yellow: #ffd766;
  --coral: #ff8066;
  --blue: #62a9ff;
  --violet: #9c82ef;
  --white: #fff;
  --shadow: 0 18px 55px rgba(7, 38, 49, .2);
  --shadow-soft: 0 10px 30px rgba(7, 38, 49, .12);
  --radius-lg: 28px;
  --radius-md: 18px;
  --topbar-h: 82px;
  color-scheme: light;
  font-family: 'Microsoft JhengHei', 'PingFang TC', system-ui, sans-serif;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }

html, body { width: 100%; min-height: 100%; margin: 0; }

body {
  background: #c8ede4;
  color: var(--ink);
  overflow-x: hidden;
  -webkit-tap-highlight-color: transparent;
}

button, input, select { font: inherit; }
button { color: inherit; }
button, a { -webkit-tap-highlight-color: transparent; }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible {
  outline: 4px solid rgba(255, 215, 102, .95);
  outline-offset: 3px;
}

.skip-link {
  position: fixed; left: 16px; top: -80px; z-index: 1000;
  padding: 12px 18px; border-radius: 12px; color: white; background: var(--deep);
  transition: top .2s ease;
}
.skip-link:focus { top: 12px; }

#labCanvas {
  position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0;
  /* touch-action alone does not stop iOS raising the selection callout and
     magnifier on a long press, which interrupts a drag mid-gesture. */
  touch-action: none;
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
}

/* The same applies to every control a child might rest a finger on. */
.stage-screen, .mission-panel, .record-panel, .variable-control,
.view-controls, .topbar, .catalog-screen {
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
}

/* The full-size content wrapper sits above the canvas. Keep its empty areas
   transparent to pointer input while restoring interaction on real controls. */
#mainContent { pointer-events: none; }
.catalog-screen { pointer-events: auto; }

.fallback-stage { position: fixed; inset: 0; z-index: 0; overflow: hidden; background: linear-gradient(165deg, #0b5966 0 32%, #82c7be 32% 100%); }
.fallback-stage::before { content: ''; position: absolute; inset: 18% -12% auto; height: 72%; border: 3px solid rgba(215,255,245,.24); border-radius: 50%; transform: rotate(-8deg); }
.fallback-island { position: absolute; left: 58%; top: 29%; width: min(36vw, 480px); aspect-ratio: 1.9; border-radius: 50%; background: #d6d8b3; box-shadow: 0 42px 0 -15px #07505a, 0 60px 40px rgba(3,41,49,.28); }
.fallback-flask { position: absolute; left: 24%; top: 22%; width: 62px; height: 78px; border: 7px solid #063d49; border-radius: 8px 8px 24px 24px; background: linear-gradient(transparent 38%, #65dcb8 39%); }
.fallback-flask::before { content: ''; position: absolute; left: 13px; top: -34px; width: 22px; height: 35px; border: 7px solid #063d49; border-block-width: 0 7px; }
.fallback-flask i { position: absolute; width: 10px; height: 10px; left: 10px; bottom: 13px; border-radius: 50%; background: white; box-shadow: 22px -8px 0 -2px rgba(255,255,255,.8); }
.fallback-atom { position: absolute; right: 14%; top: -25%; width: 110px; height: 110px; border: 3px solid rgba(255,255,255,.58); border-radius: 50%; }
.fallback-atom::after { content: ''; position: absolute; left: 43px; top: 43px; width: 23px; height: 23px; border-radius: 50%; background: var(--yellow); }
.fallback-atom i { position: absolute; inset: 10px 46px; border-radius: 50%; background: #9ce8dc; transform-origin: 9px 45px; }
.fallback-atom i:nth-child(2) { transform: rotate(120deg); }
.fallback-atom i:nth-child(3) { transform: rotate(240deg); }
.fallback-orb { position: absolute; right: 20%; bottom: 15%; width: 65px; height: 65px; border-radius: 45% 55% 48% 52%; background: #81aef2; box-shadow: inset -11px -10px 0 rgba(6,64,79,.18); }
.fallback-bench { position: absolute; left: 2%; right: 2%; bottom: -5%; height: 58%; border-radius: 42px 42px 0 0; background: #e7dfc1; box-shadow: inset 0 14px #a7edda, 0 -20px 55px rgba(6,54,62,.14); }
.fallback-apparatus { display: flex; align-items: end; justify-content: space-evenly; gap: 2vw; height: 68%; padding: 40px 8vw 0; }
.fallback-object { position: relative; display: grid; place-items: end center; width: min(13vw, 150px); height: calc(105px + var(--lift)); padding: 12px 7px; border: 5px solid #0a4651; border-radius: 22px 22px 13px 13px; color: #0a3540; background: color-mix(in srgb, var(--mint) calc(32% + var(--index) * 6%), #fff6d6); box-shadow: 0 14px 18px rgba(7,54,62,.14); transition: transform .25s, box-shadow .25s; }
.fallback-object i { position: absolute; left: 22%; right: 22%; top: 16%; height: 32%; border-radius: 50%; background: rgba(255,255,255,.65); }
.fallback-object b { overflow: hidden; max-width: 100%; font-size: 12px; text-overflow: ellipsis; white-space: nowrap; }
.fallback-object.active { transform: translateY(-14px); box-shadow: 0 0 0 7px var(--yellow), 0 20px 25px rgba(7,54,62,.18); }
.fallback-stage.accepted .fallback-object.active { animation: fallbackPulse .5s ease; }
@keyframes fallbackPulse { 50% { transform: translateY(-24px) scale(1.06); } }

.eyebrow, .section-kicker {
  margin: 0 0 10px; color: var(--mint-deep); font-size: 12px; font-weight: 800;
  letter-spacing: .17em; text-transform: uppercase;
}

.boot-screen {
  position: fixed; inset: 0; z-index: 900; display: grid; place-content: center; justify-items: center;
  padding: 30px; color: white; text-align: center;
  background: radial-gradient(circle at 50% 35%, #167482 0, #0a4050 34%, #062b39 75%);
  transition: opacity .55s ease, visibility .55s ease;
}
.boot-screen.done { opacity: 0; visibility: hidden; pointer-events: none; }
.boot-screen h1 { margin: 3px 0 6px; font: 800 clamp(38px, 7vw, 72px)/1 'Trebuchet MS', 'Microsoft JhengHei', sans-serif; }
.boot-screen .eyebrow { color: #a7f6dc; }
.boot-screen p:last-of-type { margin: 8px 0 18px; color: #d9f5f1; }
.boot-meter { width: min(320px, 70vw); height: 7px; overflow: hidden; border-radius: 9px; background: rgba(255,255,255,.16); }
.boot-meter span { display: block; width: 8%; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--mint), var(--yellow)); transition: width .35s ease; }
.boot-orbit { position: relative; width: 102px; height: 102px; border: 2px solid rgba(255,255,255,.25); border-radius: 50%; animation: spin 5s linear infinite; }
.boot-planet { position: absolute; left: 23px; top: 23px; width: 54px; height: 54px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #9bf6d9, #27a790 55%, #08716e); box-shadow: inset -7px -6px 0 rgba(0,0,0,.1); }
.boot-moon { position: absolute; right: -7px; top: 37px; width: 23px; height: 23px; border-radius: 50%; background: var(--yellow); box-shadow: 0 0 15px rgba(255,215,102,.45); }

.topbar {
  position: fixed; z-index: 60; left: 0; right: 0; top: 0; height: var(--topbar-h);
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  padding: max(12px, env(safe-area-inset-top)) max(22px, env(safe-area-inset-right)) 12px max(22px, env(safe-area-inset-left));
  color: white; background: linear-gradient(180deg, rgba(5,39,50,.8), rgba(5,39,50,.04)); pointer-events: none;
}
.topbar > * { pointer-events: auto; }
.brand-button { display: flex; align-items: center; gap: 11px; border: 0; padding: 0; color: white; background: transparent; cursor: pointer; text-align: left; }
.brand-button b { display: block; font: 800 19px/1.05 'Trebuchet MS','Microsoft JhengHei',sans-serif; }
.brand-button small { display: block; margin-top: 2px; color: #b8e4e2; font: 700 9px/1 'Trebuchet MS', sans-serif; letter-spacing: .16em; }
.brand-mark { display: grid; place-items: center; width: 45px; height: 45px; border-radius: 15px; color: var(--deep); background: var(--mint); box-shadow: 0 7px 18px rgba(0,0,0,.17); transform: rotate(-3deg); }
.brand-mark svg { width: 31px; height: 31px; fill: none; stroke: currentColor; stroke-width: 2.3; stroke-linecap: round; stroke-linejoin: round; }
.topbar-actions { display: flex; align-items: center; gap: 9px; }
.icon-button { display: grid; place-items: center; width: 43px; height: 43px; padding: 0; border: 1px solid rgba(255,255,255,.22); border-radius: 14px; color: white; background: rgba(7,47,60,.48); backdrop-filter: blur(11px); cursor: pointer; transition: transform .2s, background .2s; }
.icon-button:hover { transform: translateY(-2px); background: rgba(7,47,60,.72); }
.icon-button svg { width: 21px; height: 21px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.icon-button .sound-off { display: none; }
.icon-button[aria-pressed="false"] .sound-on { display: none; }
.icon-button[aria-pressed="false"] .sound-off { display: block; }
.portal-link { padding: 11px 15px; border: 1px solid rgba(255,255,255,.2); border-radius: 14px; color: white; background: rgba(7,47,60,.48); text-decoration: none; font-size: 13px; font-weight: 700; backdrop-filter: blur(11px); }
.progress-chip { display: flex; align-items: center; gap: 8px; height: 45px; padding: 5px 13px 5px 7px; border: 1px solid rgba(255,255,255,.2); border-radius: 15px; background: rgba(7,47,60,.48); backdrop-filter: blur(11px); }
.progress-chip b, .progress-chip small { display: block; line-height: 1.15; }
.progress-chip b { font-size: 13px; }
.progress-chip small { color: #c8e7e5; font-size: 9px; }
.progress-ring { position: relative; display: block; width: 31px; height: 31px; padding: 4px; border: 4px solid rgba(255,255,255,.18); border-radius: 50%; }
.progress-ring i { display: block; width: 100%; height: 100%; border-radius: 50%; background: var(--yellow); }

main { position: relative; z-index: 5; min-height: 100vh; }

.catalog-screen { min-height: 100vh; padding: calc(var(--topbar-h) + 42px) clamp(22px, 5vw, 76px) 70px; }
.catalog-hero { min-height: 560px; width: min(600px, 47vw); display: flex; flex-direction: column; align-items: flex-start; justify-content: center; color: white; }
.catalog-hero .eyebrow { color: #9ff0d5; }
.catalog-hero .eyebrow span { color: var(--yellow); }
.catalog-hero h1 { margin: 0; max-width: 630px; font: 800 clamp(48px, 6.6vw, 88px)/.92 'Trebuchet MS', 'Microsoft JhengHei', sans-serif; letter-spacing: -.03em; text-shadow: 0 7px 25px rgba(6,40,49,.2); }
.catalog-hero h1 em { color: var(--yellow); font-style: normal; }
.catalog-hero > p:not(.eyebrow) { max-width: 530px; margin: 25px 0; color: #f2fffc; font-size: clamp(16px, 1.5vw, 19px); line-height: 1.8; text-shadow: 0 2px 12px rgba(4,47,57,.72); }
.hero-actions { display: flex; align-items: center; gap: 16px; }
.primary-button, .secondary-button { display: inline-flex; align-items: center; justify-content: center; gap: 11px; min-height: 49px; border-radius: 15px; padding: 0 21px; font-weight: 800; cursor: pointer; transition: transform .2s, filter .2s, box-shadow .2s; }
.primary-button { border: 0; color: var(--deep); background: var(--yellow); box-shadow: 0 9px 0 #d19c35, 0 14px 30px rgba(5,36,44,.3); }
.primary-button:hover:not(:disabled) { transform: translateY(-2px); filter: brightness(1.03); }
.primary-button:active:not(:disabled) { transform: translateY(5px); box-shadow: 0 4px 0 #d19c35; }
.primary-button:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; }
.primary-button svg { width: 21px; height: 21px; fill: none; stroke: currentColor; stroke-width: 2.2; }
.secondary-button { border: 1px solid #c8d5d6; color: var(--ink); background: white; box-shadow: none; }
.text-button { border: 0; padding: 12px 5px; color: white; background: transparent; font-weight: 700; text-decoration: underline; text-decoration-color: rgba(255,255,255,.45); text-underline-offset: 5px; cursor: pointer; }
.hero-proof { display: flex; align-items: center; gap: 16px; margin-top: 30px; color: #d8efec; font-size: 12px; }
.hero-proof b { color: white; font: 800 18px 'Trebuchet MS', sans-serif; }
.hero-proof i { width: 1px; height: 20px; background: rgba(255,255,255,.25); }

.catalog-panel { position: relative; margin-top: 20px; padding: clamp(24px, 4vw, 52px); border-radius: 36px; background: rgba(255,253,247,.96); box-shadow: var(--shadow); backdrop-filter: blur(14px); }
.catalog-panel::before { content: ''; position: absolute; inset: 7px; pointer-events: none; border: 1px solid rgba(18,69,77,.08); border-radius: 30px; }
.catalog-toolbar { position: relative; display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; margin-bottom: 28px; }
.catalog-toolbar h2 { margin: 0; font: 800 clamp(28px,3vw,40px)/1 'Trebuchet MS','Microsoft JhengHei',sans-serif; }
.filter-row { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 7px; }
.filter-chip { min-height: 44px; border: 1px solid #d7e1df; border-radius: 99px; padding: 8px 14px; color: var(--ink-soft); background: white; font-size: 12px; font-weight: 700; cursor: pointer; }
.filter-chip:hover, .filter-chip.active { border-color: var(--deep); color: white; background: var(--deep); }
.experiment-grid { position: relative; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.experiment-card { --accent: var(--mint); position: relative; overflow: hidden; min-height: 252px; border: 0; border-radius: 23px; padding: 0; color: var(--ink); background: #edf6f2; text-align: left; cursor: pointer; box-shadow: inset 0 0 0 1px rgba(14,64,70,.06); transition: transform .24s cubic-bezier(.2,.8,.2,1), box-shadow .24s; }
.experiment-card:hover { transform: translateY(-7px) rotate(.2deg); box-shadow: 0 15px 30px rgba(17,62,69,.16); }
.experiment-card[hidden] { display: none; }
.card-art { position: relative; display: block; height: 138px; overflow: hidden; background: linear-gradient(145deg, color-mix(in srgb, var(--accent) 42%, white), color-mix(in srgb, var(--accent) 20%, #d8f1ee)); }
.card-art::before { content: ''; position: absolute; width: 160px; height: 160px; right: -45px; top: -55px; border: 22px solid rgba(255,255,255,.27); border-radius: 50%; }
.card-art::after { content: ''; position: absolute; left: 18px; right: 18px; bottom: 12px; height: 13px; border-radius: 50%; background: rgba(10,62,68,.14); filter: blur(6px); }
.card-illustration { position: absolute; left: 50%; top: 48%; width: 95px; height: 95px; transform: translate(-50%,-50%); z-index: 2; filter: drop-shadow(0 12px 7px rgba(5,55,63,.18)); }
.card-illustration svg { width: 100%; height: 100%; overflow: visible; }
.card-complete { position: absolute; z-index: 3; right: 11px; top: 11px; display: none; place-items: center; width: 30px; height: 30px; border-radius: 50%; color: var(--deep); background: var(--yellow); box-shadow: 0 4px 12px rgba(0,0,0,.17); font-weight: 900; }
.experiment-card.completed .card-complete { display: grid; }
.card-copy { display: block; padding: 16px 17px 17px; }
.card-topline { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 4px; color: var(--ink-soft); font-size: 10px; font-weight: 800; letter-spacing: .06em; }
.card-topic { padding: 3px 8px; border-radius: 99px; color: color-mix(in srgb, var(--accent) 60%, #173942); background: color-mix(in srgb, var(--accent) 18%, white); }
.card-copy h3 { margin: 6px 0 2px; font-size: 18px; line-height: 1.2; }
.card-copy p { overflow: hidden; margin: 0; color: var(--ink-soft); font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
.card-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 11px; }
.card-stars { color: #e4a828; font-size: 13px; letter-spacing: 1px; }
.card-arrow { display: grid; place-items: center; width: 27px; height: 27px; border-radius: 50%; color: white; background: var(--deep); }

.lab-screen { min-height: 100vh; pointer-events: none; }
.lab-screen button, .mission-panel, .variable-control, .observation-strip, .view-controls { pointer-events: auto; }
.observation-strip { pointer-events: none; }
.lab-heading { position: fixed; z-index: 20; left: max(22px, env(safe-area-inset-left)); top: calc(var(--topbar-h) + 12px); color: white; }
.back-button { display: flex; align-items: center; gap: 6px; border: 0; padding: 7px 9px 7px 0; color: #d5efec; background: transparent; font-size: 12px; font-weight: 700; cursor: pointer; }
.back-button svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 2; }
.lab-title-block { display: flex; align-items: center; gap: 12px; margin-top: 4px; }
.lab-number { display: grid; place-items: center; width: 47px; height: 47px; border: 1px solid rgba(255,255,255,.3); border-radius: 15px; color: var(--yellow); background: rgba(7,47,60,.45); backdrop-filter: blur(12px); font: 800 20px 'Trebuchet MS', sans-serif; }
.lab-title-block p { margin: 0; color: #bce0de; font-size: 10px; font-weight: 700; }
.lab-title-block h1 { margin: 1px 0 0; font-size: clamp(22px,3vw,34px); line-height: 1.1; text-shadow: 0 2px 12px rgba(0,0,0,.2); }

.mission-panel { position: fixed; z-index: 30; right: max(18px, env(safe-area-inset-right)); top: calc(var(--topbar-h) + 16px); width: min(340px, calc(100vw - 44px)); padding: 22px; border: 1px solid rgba(255,255,255,.45); border-radius: 25px; background: rgba(255,253,247,.96); box-shadow: var(--shadow); backdrop-filter: blur(15px); transition: width .22s ease, padding .22s ease, background .22s ease, box-shadow .22s ease; }
.mission-panel-toggle { position: absolute; left: -21px; top: 20px; display: flex; align-items: center; justify-content: center; width: 44px; height: 52px; overflow: hidden; border: 1px solid rgba(255,255,255,.45); border-radius: 16px 0 0 16px; padding: 0; color: white; background: rgba(7,47,60,.94); box-shadow: -6px 8px 18px rgba(4,35,43,.18); cursor: pointer; transition: width .22s ease, border-radius .22s ease, transform .22s ease; }
.mission-toggle-arrow { flex: 0 0 auto; font-size: 26px; font-weight: 800; line-height: 1; }
.mission-toggle-copy { display: none; min-width: 0; text-align: left; }
.mission-toggle-copy small, .mission-toggle-copy b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mission-toggle-copy small { margin-bottom: 2px; color: #aee9dc; font-size: 10px; font-weight: 800; }
.mission-toggle-copy b { color: white; font-size: 14px; line-height: 1.25; }
.mission-panel-body { transition: opacity .18s ease; }
.mission-panel.collapsed { width: 0; height: 0; min-height: 0; padding-inline: 0; border-color: transparent; background: transparent; box-shadow: none; backdrop-filter: none; pointer-events: none; }
.mission-panel.collapsed .mission-panel-body { overflow: hidden; width: 0; opacity: 0; pointer-events: none; }
.mission-panel.collapsed .mission-panel-toggle { left: auto; right: 0; top: 0; justify-content: flex-start; gap: 10px; width: min(255px, calc(100vw - 168px)); height: 58px; border-radius: 18px; padding: 7px 14px 7px 12px; transform: none; pointer-events: auto; }
.mission-panel.collapsed .mission-toggle-arrow { transform: rotate(180deg); }
.mission-panel.collapsed .mission-toggle-copy { display: block; min-width: 0; }
.mission-progress { display: flex; align-items: center; gap: 10px; color: var(--ink-soft); font-size: 12px; font-weight: 800; }
.mission-progress > div { flex: 1; height: 5px; overflow: hidden; border-radius: 9px; background: #dbe5e2; }
.mission-progress i { display: block; width: 20%; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--mint-deep), var(--mint)); transition: width .4s ease; }
.mission-verb { display: inline-block; margin: 18px 0 7px; padding: 5px 10px; border-radius: 8px; color: #116b5f; background: #dff8ef; font-size: 12px; font-weight: 900; letter-spacing: .08em; }
.mission-panel h2 { margin: 0; font-size: 22px; line-height: 1.35; }
.mission-panel-body > p:not(.mission-verb) { margin: 9px 0 0; color: var(--ink-soft); font-size: 15px; line-height: 1.6; }
.mission-cue { display: flex; align-items: center; gap: 9px; margin-top: 16px; padding: 11px 12px; border: 1px dashed #bed1cd; border-radius: 13px; color: #506b70; background: #f2f8f5; font-size: 13px; font-weight: 700; }
.cue-hand { font-size: 20px; animation: bob 1.4s ease-in-out infinite; }
.mission-actions { display: flex; justify-content: space-between; gap: 8px; margin-top: 15px; }
.hint-button, .reset-button, .accessible-action-button { min-height: 44px; border: 0; border-radius: 11px; padding: 9px 12px; font-size: 12px; font-weight: 800; cursor: pointer; }
.hint-button { display: flex; align-items: center; gap: 5px; color: #765811; background: #fff0be; }
.hint-button svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; }
.reset-button { color: var(--ink-soft); background: #e9efed; }
.accessible-action-button { color: white; background: var(--deep); }
.hint-box { margin-top: 10px; padding: 12px; border-radius: 11px; color: #624d18; background: #fff7dd; font-size: 14px; line-height: 1.55; }

.variable-control { position: fixed; z-index: 22; left: 50%; bottom: max(31px, env(safe-area-inset-bottom)); transform: translateX(-50%); display: grid; grid-template-columns: auto minmax(150px, 260px) auto; align-items: center; gap: 11px; padding: 12px 16px; border: 1px solid rgba(255,255,255,.25); border-radius: 18px; color: white; background: rgba(6,44,55,.78); box-shadow: var(--shadow-soft); backdrop-filter: blur(13px); }
.variable-control label, .variable-control output { font-size: 14px; font-weight: 800; }
.variable-control input { accent-color: var(--yellow); }
.observation-strip { position: fixed; z-index: 24; left: 50%; bottom: max(30px, env(safe-area-inset-bottom)); transform: translateX(-50%); display: flex; align-items: center; gap: 12px; width: min(520px, calc(100vw - 44px)); padding: 13px 17px; border: 1px solid rgba(255,255,255,.3); border-radius: 18px; color: white; background: rgba(7,47,60,.86); box-shadow: var(--shadow-soft); backdrop-filter: blur(14px); }
.observation-icon { display: grid; place-items: center; flex: 0 0 auto; width: 34px; height: 34px; border-radius: 50%; color: var(--deep); background: var(--yellow); font-size: 22px; font-weight: 900; }
.observation-strip b { display: block; color: var(--yellow); font-size: 12px; }
.observation-strip p { margin: 1px 0 0; font-size: 15px; line-height: 1.45; }
.interaction-label { position: fixed; z-index: 40; transform: translate(-50%, -130%); max-width: min(260px, calc(100vw - 24px)); padding: 9px 14px; border: 2px solid rgba(8,47,61,.12); border-radius: 11px; color: var(--deep); background: white; box-shadow: 0 10px 28px rgba(4,35,43,.2); font-size: 16px; font-weight: 900; line-height: 1.25; text-align: center; pointer-events: none; }
.interaction-label::after { content: ''; position: absolute; left: 50%; bottom: -5px; width: 10px; height: 10px; background: white; transform: translateX(-50%) rotate(45deg); }
.view-controls { position: fixed; z-index: 21; left: max(22px, env(safe-area-inset-left)); bottom: max(25px, env(safe-area-inset-bottom)); display: flex; gap: 5px; padding: 5px; border: 1px solid rgba(255,255,255,.2); border-radius: 14px; background: rgba(7,47,60,.55); backdrop-filter: blur(11px); }
.view-controls button { width: 44px; height: 44px; border: 0; border-radius: 10px; color: white; background: transparent; font-size: 18px; cursor: pointer; }
.view-controls button:hover { background: rgba(255,255,255,.13); }

/* Completion is deliberately staged: the apparatus remains visible long
   enough to observe the final phenomenon before the explanation dialog. */
.phenomenon-stage { position: fixed; z-index: 55; inset: var(--topbar-h) 0 0; pointer-events: none; }
.phenomenon-focus { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 48%, transparent 25%, rgba(3,31,39,.08) 72%, rgba(3,31,39,.3) 100%); animation: phenomenonFocus .5s ease-out both; }
.phenomenon-caption { --phenomenon-duration: 4200ms; position: absolute; left: 50%; bottom: max(20px, env(safe-area-inset-bottom)); display: grid; grid-template-columns: auto minmax(0,1fr) auto; align-items: center; gap: 15px; width: min(760px, calc(100vw - 40px)); overflow: hidden; border: 1px solid rgba(255,255,255,.4); border-radius: 22px; padding: 15px 18px 18px; color: white; background: rgba(6,43,54,.9); box-shadow: 0 20px 60px rgba(2,26,33,.38); backdrop-filter: blur(16px); transform: translateX(-50%); pointer-events: auto; animation: phenomenonRise .42s cubic-bezier(.2,.8,.2,1) both; }
.phenomenon-mark { display: grid; place-items: center; width: 50px; height: 50px; border-radius: 16px; color: var(--deep); background: var(--yellow); box-shadow: 0 0 0 6px rgba(255,215,102,.14); font-size: 29px; font-weight: 900; }
.phenomenon-copy { min-width: 0; }
.phenomenon-copy .section-kicker { margin: 0 0 2px; color: #8ff2d1; font-size: 10px; }
.phenomenon-copy h2 { margin: 0; font-size: clamp(18px,2.4vw,24px); line-height: 1.2; }
.phenomenon-copy > p:last-of-type { margin: 3px 0 0; color: #eefcf9; font-size: 15px; line-height: 1.4; }
.phenomenon-comparison { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 7px; color: var(--yellow); font-size: 13px; font-weight: 800; }
.phenomenon-actions { display: grid; justify-items: end; gap: 7px; }
.phenomenon-actions span { color: #b9d9d7; font-size: 10px; font-weight: 700; }
.phenomenon-actions button { min-height: 42px; border: 1px solid rgba(255,255,255,.35); border-radius: 12px; padding: 0 14px; color: var(--deep); background: var(--yellow); font-size: 13px; font-weight: 900; cursor: pointer; }
.phenomenon-timer { position: absolute; left: 0; bottom: 0; width: 100%; height: 4px; background: linear-gradient(90deg,var(--mint),var(--yellow)); transform-origin: left; animation: phenomenonTimer var(--phenomenon-duration) linear forwards; }
.lab-screen.showing-phenomenon .mission-panel,
.lab-screen.showing-phenomenon .variable-control,
.lab-screen.showing-phenomenon .observation-strip,
.lab-screen.showing-phenomenon .view-controls,
.lab-screen.showing-phenomenon .interaction-label { visibility: hidden; pointer-events: none; }

dialog { color: var(--ink); }
dialog::backdrop { background: rgba(3,31,39,.64); backdrop-filter: blur(6px); }
.glass-dialog { width: min(590px, calc(100vw - 34px)); max-height: calc(100dvh - 24px); overflow-y: auto; border: 1px solid rgba(255,255,255,.75); border-radius: 30px; padding: clamp(26px,5vw,45px); background: rgba(255,253,247,.97); box-shadow: 0 30px 90px rgba(2,28,35,.4); }
.glass-dialog[open] { animation: dialogIn .28s cubic-bezier(.2,.8,.2,1); }
.glass-dialog h2 { margin: 0 0 12px; font: 800 clamp(25px,4vw,36px)/1.15 'Trebuchet MS','Microsoft JhengHei',sans-serif; }
.dialog-close { position: absolute; right: 18px; top: 16px; display: grid; place-items: center; width: 36px; height: 36px; border: 0; border-radius: 50%; color: var(--ink-soft); background: #e8efec; font-size: 24px; cursor: pointer; }
.dialog-icon { display: grid; place-items: center; width: 58px; height: 58px; margin-bottom: 20px; border-radius: 20px; color: var(--deep); background: var(--yellow); font: 800 33px 'Trebuchet MS',sans-serif; transform: rotate(-4deg); }
.prediction-dialog > p:not(.section-kicker) { color: var(--ink-soft); line-height: 1.7; }
.prediction-options { display: grid; gap: 9px; margin: 22px 0; }
.prediction-option { position: relative; display: flex; align-items: center; gap: 12px; min-height: 53px; padding: 12px 15px; border: 2px solid #dfe8e6; border-radius: 15px; background: white; cursor: pointer; font-weight: 600; text-align: left; }
.prediction-option:hover, .prediction-option.selected { border-color: var(--mint-deep); background: #edfaf5; }
.prediction-option i { display: grid; place-items: center; flex: 0 0 auto; width: 25px; height: 25px; border: 2px solid #b6c9c5; border-radius: 50%; font-style: normal; }
.prediction-option.selected i { border-color: var(--mint-deep); color: white; background: var(--mint-deep); }
.prediction-dialog .primary-button { width: 100%; }

.result-dialog { width: min(720px, calc(100vw - 32px)); text-align: center; }
.result-burst { position: relative; display: grid; place-items: center; width: 74px; height: 74px; margin: -5px auto 16px; border-radius: 24px; color: #7a5710; background: var(--yellow); box-shadow: 0 0 0 9px #fff3c8; transform: rotate(4deg); }
.result-burst span { font-size: 37px; }
.result-score span { color: #e4a520; font-size: 24px; letter-spacing: 4px; }
.result-score small { display: block; margin-top: 1px; color: var(--ink-soft); }
.result-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 22px 0 14px; text-align: left; }
.result-grid section { padding: 14px 16px; border-radius: 15px; background: #eef5f2; }
.result-grid .result-comparison { grid-column: 1 / -1; border: 2px solid #bfe5db; background: #eafbf5; }
.result-grid .result-explain { grid-column: 1 / -1; background: #fff4d2; }
.result-label { color: var(--mint-deep); font-size: 10px; font-weight: 900; letter-spacing: .08em; }
.result-grid p { margin: 4px 0 0; font-size: 13px; line-height: 1.65; }
.comparison-values { display: grid; grid-template-columns: 1fr auto 1fr; align-items: stretch; gap: 12px; margin: 9px 0 3px; text-align: center; }
.comparison-values > div { padding: 10px 12px; border-radius: 12px; background: white; }
.comparison-values > span { align-self: center; color: var(--mint-deep); font-size: 23px; font-weight: 900; }
.comparison-values small, .comparison-values b { display: block; }
.comparison-values small { color: var(--ink-soft); font-size: 11px; }
.comparison-values b { margin-top: 3px; color: var(--deep); font-size: 18px; }
.curriculum-link { display: flex; align-items: center; gap: 12px; padding: 11px 14px; border: 1px solid #d9e4e1; border-radius: 13px; color: var(--ink-soft); text-align: left; }
.curriculum-link b { flex: 0 0 auto; padding: 5px 8px; border-radius: 7px; color: white; background: var(--deep); font-size: 10px; }
.curriculum-link span { font-size: 10px; }
.result-actions { display: flex; justify-content: center; gap: 10px; margin-top: 22px; }

.drawer-dialog { position: fixed; inset: 0 0 0 auto; width: min(480px, 100vw); max-width: none; height: 100%; max-height: none; margin: 0; border: 0; border-radius: 28px 0 0 28px; padding: 28px; background: var(--paper); box-shadow: -20px 0 60px rgba(4,35,43,.3); }
.drawer-dialog[open] { animation: drawerIn .28s ease-out; }
.drawer-head { display: flex; align-items: flex-start; justify-content: space-between; }
.drawer-head h2 { margin: 0; font-size: 30px; }
.drawer-head .dialog-close { position: static; }
.notebook-summary { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; margin: 25px 0; }
.summary-tile { padding: 13px 8px; border-radius: 14px; color: white; background: var(--deep); text-align: center; }
.summary-tile b { display: block; color: var(--yellow); font: 800 24px 'Trebuchet MS',sans-serif; }
.summary-tile span { font-size: 9px; }
.notebook-entries { display: grid; gap: 9px; }
.notebook-entry { display: grid; grid-template-columns: 38px 1fr auto; align-items: center; gap: 11px; padding: 12px; border: 1px solid #e0e8e5; border-radius: 15px; background: white; }
.notebook-entry .entry-number { display: grid; place-items: center; width: 37px; height: 37px; border-radius: 12px; color: var(--deep); background: #dff7ef; font: 800 15px 'Trebuchet MS',sans-serif; }
.notebook-entry b, .notebook-entry small { display: block; }
.notebook-entry small { margin-top: 2px; color: var(--ink-soft); font-size: 9px; }
.notebook-entry .entry-stars { color: #dea420; letter-spacing: 1px; }
.notebook-entry.locked { opacity: .5; filter: grayscale(.7); }

.settings-dialog { width: min(520px, calc(100vw - 34px)); }
.toggle-row { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 14px 0; border-bottom: 1px solid #e2e9e7; cursor: pointer; }
.toggle-row b, .toggle-row small, .quality-row b, .quality-row small { display: block; }
.toggle-row small, .quality-row small { margin-top: 3px; color: var(--ink-soft); font-size: 10px; }
.toggle-row input { position: absolute; opacity: 0; }
.toggle-row i { position: relative; flex: 0 0 auto; width: 47px; height: 27px; border-radius: 99px; background: #cad5d2; transition: background .2s; }
.toggle-row i::after { content: ''; position: absolute; left: 3px; top: 3px; width: 21px; height: 21px; border-radius: 50%; background: white; box-shadow: 0 2px 6px rgba(0,0,0,.2); transition: transform .2s; }
.toggle-row input:checked + i { background: var(--mint-deep); }
.toggle-row input:checked + i::after { transform: translateX(20px); }
.quality-row { display: flex; align-items: center; justify-content: space-between; gap: 15px; padding-top: 17px; }
.quality-row select { border: 1px solid #c8d5d2; border-radius: 11px; padding: 9px 30px 9px 11px; background: white; }

.tour-visual { position: relative; width: 220px; height: 100px; margin: 0 auto 20px; }
.tour-object, .tour-target { position: absolute; top: 27px; width: 54px; height: 54px; border-radius: 17px; }
.tour-object { left: 17px; background: var(--coral); box-shadow: inset -7px -6px rgba(0,0,0,.08); animation: tutorialMove 2.1s ease-in-out infinite; }
.tour-target { right: 17px; border: 3px dashed var(--mint-deep); background: rgba(90,224,184,.15); }
.tour-line { position: absolute; left: 74px; right: 74px; top: 52px; border-top: 2px dashed #9eb5b2; }
.tour-steps { display: grid; gap: 12px; margin: 22px 0; text-align: left; }
.tour-steps > div { display: flex; align-items: center; gap: 12px; }
.tour-steps b { display: grid; place-items: center; flex: 0 0 auto; width: 31px; height: 31px; border-radius: 10px; color: white; background: var(--deep); }
.tour-steps strong { display: block; }
.tour-steps span { color: var(--ink-soft); font-size: 12px; }
.keyboard-note { padding: 10px; border-radius: 10px; color: var(--ink-soft); background: #eef4f2; font-size: 10px; text-align: center; }
.tour-dialog .primary-button { width: 100%; margin-top: 12px; }

.toast-region { position: fixed; z-index: 800; left: 50%; top: 95px; display: grid; gap: 8px; transform: translateX(-50%); pointer-events: none; }
.toast { min-width: min(330px, calc(100vw - 36px)); padding: 12px 16px; border-radius: 13px; color: white; background: rgba(7,47,60,.94); box-shadow: var(--shadow-soft); font-size: 12px; font-weight: 700; text-align: center; animation: toastIn .25s ease-out, toastOut .3s 2.5s forwards; }
.toast.success { color: var(--deep); background: var(--mint); }
.toast.try { background: var(--coral); }
.screen-flash { position: fixed; z-index: 700; inset: 0; opacity: 0; pointer-events: none; background: radial-gradient(circle, rgba(255,236,154,.5), transparent 65%); }
.screen-flash.active { animation: flash .65s ease-out; }

.high-contrast .mission-cue { border-width: 3px; border-color: #075f55; }
.high-contrast .experiment-card { box-shadow: inset 0 0 0 2px var(--ink); }
.high-contrast .catalog-hero > p:not(.eyebrow), .high-contrast .hero-proof, .high-contrast .lab-title-block p { color: #fff; text-shadow: 0 2px 5px #063c48; }
.high-contrast .card-copy p, .high-contrast .card-topline { color: #203f46; }
.high-contrast .filter-chip { border-width: 2px; border-color: #36575e; color: #173942; }
.high-contrast .filter-chip.active { color: #fff; background: #001f29; }
.high-contrast .mission-panel, .high-contrast .glass-dialog { border: 3px solid #062f3c; background: #fffef9; }

@keyframes spin { to { transform: rotate(360deg); } }
@keyframes bob { 50% { transform: translateY(-4px) rotate(-7deg); } }
@keyframes dialogIn { from { opacity: 0; transform: translateY(20px) scale(.96); } }
@keyframes drawerIn { from { transform: translateX(100%); } }
@keyframes tutorialMove { 45%, 55% { transform: translateX(130px) rotate(7deg); } }
@keyframes toastIn { from { opacity: 0; transform: translateY(-10px) scale(.96); } }
@keyframes toastOut { to { opacity: 0; transform: translateY(-8px); } }
@keyframes flash { 30% { opacity: 1; } 100% { opacity: 0; } }
@keyframes phenomenonRise { from { opacity: 0; transform: translate(-50%,18px) scale(.97); } }
@keyframes phenomenonFocus { from { opacity: 0; } }
@keyframes phenomenonTimer { to { transform: scaleX(0); } }

@media (max-width: 1120px) {
  .experiment-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .catalog-hero { width: 56vw; }
}

@media (max-width: 820px) {
  :root { --topbar-h: 68px; }
  .topbar { padding-inline: 14px; }
  .progress-chip, .portal-link { display: none; }
  .brand-button b { font-size: 16px; }
  .brand-mark { width: 40px; height: 40px; border-radius: 13px; }
  .catalog-screen { padding-inline: 17px; padding-top: calc(var(--topbar-h) + 25px); }
  .catalog-hero { width: min(600px, 90vw); min-height: 560px; }
  .catalog-hero h1 { font-size: clamp(45px, 12vw, 70px); }
  .catalog-panel { padding: 28px 20px; border-radius: 28px; }
  .catalog-toolbar { align-items: flex-start; flex-direction: column; }
  .filter-row { justify-content: flex-start; }
  .experiment-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .mission-panel { top: auto; left: 12px; right: 12px; bottom: max(12px, env(safe-area-inset-bottom)); width: auto; padding: 16px 18px; border-radius: 21px; }
  .mission-panel-toggle { left: auto; right: 12px; top: -40px; width: 48px; height: 42px; border-radius: 13px 13px 0 0; }
  .mission-panel.collapsed { left: auto; right: 12px; top: calc(var(--topbar-h) + 116px); bottom: auto; width: 0; height: 0; padding: 0; }
  .mission-panel.collapsed .mission-panel-toggle { left: auto; right: 0; top: 0; width: min(235px, calc(100vw - 156px)); height: 56px; border-radius: 17px; transform: none; }
  .mission-panel h2 { font-size: 19px; }
  .mission-panel-body > p:not(.mission-verb), .mission-cue { font-size: 13px; }
  .mission-cue { margin-top: 10px; padding: 8px 10px; }
  .mission-verb { margin-top: 12px; }
  .mission-actions { margin-top: 9px; }
  .lab-heading { left: 14px; top: calc(var(--topbar-h) + 7px); }
  .lab-title-block { gap: 8px; }
  .lab-number { width: 39px; height: 39px; border-radius: 12px; }
  .lab-title-block h1 { font-size: 21px; }
  .view-controls { left: 14px; bottom: max(14px, env(safe-area-inset-bottom)); }
  .variable-control, .observation-strip { bottom: max(14px, env(safe-area-inset-bottom)); }
  .lab-screen.mission-open .view-controls,
  .lab-screen.mission-open .variable-control,
  .lab-screen.mission-open .observation-strip { bottom: 247px; }
  .variable-control { grid-template-columns: auto minmax(110px, 38vw) auto; }
  .phenomenon-caption { width: calc(100vw - 24px); }
}

@media (max-width: 520px) {
  .brand-button small, .topbar-actions .icon-button:nth-of-type(1) { display: none; }
  .icon-button { width: 44px; height: 44px; }
  .catalog-hero { min-height: 520px; padding-top: 20px; }
  .catalog-hero > p:not(.eyebrow) { font-size: 14px; }
  .hero-actions { align-items: flex-start; flex-direction: column; }
  .hero-proof { flex-wrap: wrap; gap: 9px; }
  .experiment-grid { grid-template-columns: 1fr; }
  .experiment-card { min-height: 230px; }
  .card-art { height: 124px; }
  .card-topline { font-size: 12px; }
  .card-copy p { font-size: 13px; }
  .lab-title-block p { display: none; }
  .mission-panel { padding: 13px 15px; }
  .mission-cue { display: none; }
  .view-controls button { width: 44px; height: 44px; }
  .observation-strip { width: calc(100vw - 28px); padding: 10px 13px; }
  .result-grid { grid-template-columns: 1fr; }
  .result-grid .result-explain, .result-grid .result-comparison { grid-column: auto; }
  .result-actions { flex-direction: column; }
  .curriculum-link { align-items: flex-start; flex-direction: column; }
  .drawer-dialog { padding: 21px 17px; border-radius: 0; }
  .toast-region { top: auto; bottom: max(82px, calc(env(safe-area-inset-bottom) + 70px)); }
  .lab-screen.mission-open .view-controls,
  .lab-screen.mission-open .variable-control,
  .lab-screen.mission-open .observation-strip { bottom: 222px; }
  .phenomenon-caption { grid-template-columns: auto minmax(0,1fr); gap: 11px; bottom: max(10px, env(safe-area-inset-bottom)); padding: 13px 14px 16px; }
  .phenomenon-mark { width: 42px; height: 42px; border-radius: 14px; font-size: 24px; }
  .phenomenon-copy h2 { font-size: 18px; }
  .phenomenon-copy > p:last-of-type { font-size: 13px; }
  .phenomenon-actions { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; width: 100%; }
  .comparison-values { gap: 7px; }
  .comparison-values > div { padding-inline: 7px; }
}

@media (max-height: 500px) and (orientation: landscape) {
  :root { --topbar-h: 56px; }
  .topbar { padding: 6px 10px; }
  .brand-mark { width: 40px; height: 40px; }
  .brand-button small, .progress-chip, .portal-link { display: none; }
  .lab-heading { left: 10px; top: 58px; }
  .back-button { min-height: 40px; padding-block: 4px; }
  .lab-title-block { margin-top: 0; }
  .lab-number { width: 36px; height: 36px; }
  .lab-title-block h1 { font-size: 18px; }
  .lab-title-block p { display: none; }
  .mission-panel { top: 62px; right: 8px; bottom: auto; left: auto; width: min(230px, 33vw); padding: 10px 11px; border-radius: 15px; }
  .mission-panel-toggle { left: -35px; right: auto; top: 8px; width: 36px; height: 44px; border-radius: 12px 0 0 12px; transform: none; }
  .mission-panel.collapsed { top: 62px; right: 0; bottom: auto; left: auto; width: 0; height: auto; padding: 0; }

/* --- Inquiry cycle: observe, record, analyse ----------------------------- */
.record-panel { position: fixed; z-index: 22; left: 50%; bottom: max(31px, env(safe-area-inset-bottom)); transform: translateX(-50%); display: grid; gap: 9px; justify-items: center; padding: 13px 18px; border: 1px solid rgba(255,255,255,.25); border-radius: 18px; color: white; background: rgba(6,44,55,.82); box-shadow: var(--shadow-soft); backdrop-filter: blur(13px); }
.record-panel .section-kicker { color: #7fe6c4; }
.record-panel b { font-size: 15px; }
.record-options { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.record-option { min-height: 44px; min-width: 78px; padding: 10px 16px; border: 2px solid rgba(255,255,255,.35); border-radius: 13px; color: white; background: rgba(255,255,255,.08); cursor: pointer; font-size: 16px; font-weight: 800; }
.record-option:hover { border-color: var(--yellow); background: rgba(255,216,79,.18); }




/* --- Slide stage --------------------------------------------------------- */
/* One idea per screen, at tablet reading size. Type scales with the viewport
   so the same slide works on a phone, an iPad and a projector. */
.stage-screen { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: max(24px, 4vh) max(20px, 4vw); background: linear-gradient(160deg, #f7fbf9 0%, #eaf5f2 55%, #e2f1ee 100%); overscroll-behavior: contain; }
.stage-screen[hidden] { display: none; }
.stage-inner { display: grid; grid-template-rows: auto 1fr auto; gap: clamp(14px, 2.4vh, 26px); width: min(920px, 100%); max-height: 100%; }
.stage-kicker { margin: 0; color: var(--mint-deep); font-size: clamp(14px, 1.5vw, 18px); font-weight: 800; letter-spacing: .16em; }
.stage-kicker[hidden] { display: none; }
.stage-body { display: grid; align-content: center; min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
.stage-body.entering { animation: stage-in .42s cubic-bezier(.2,.8,.3,1) both; }
@keyframes stage-in { from { opacity: 0; transform: translateY(22px); } to { opacity: 1; transform: none; } }

.stage-heading { margin: 0; font-size: clamp(24px, 3.4vw, 40px); line-height: 1.35; }
.stage-lead { margin: 0 0 10px; color: var(--mint-deep); font-size: clamp(16px, 1.9vw, 22px); font-weight: 800; }
.stage-label { display: block; margin-bottom: 6px; color: var(--mint-deep); font-size: clamp(13px, 1.4vw, 16px); font-weight: 800; letter-spacing: .08em; }

/* Chapter card: a beat that names the phase before it begins. */
.stage-chapter { display: grid; justify-items: center; gap: 10px; text-align: center; }
.stage-chapter-step { display: inline-grid; place-items: center; padding: 8px 22px; border-radius: 999px; color: white; background: var(--mint-deep); font-size: clamp(16px, 2vw, 24px); font-weight: 800; letter-spacing: .1em; animation: stage-pop .5s cubic-bezier(.2,1.3,.4,1) both; }
.stage-chapter-title { margin: 0; font-size: clamp(46px, 9vw, 108px); line-height: 1.1; letter-spacing: .06em; animation: stage-pop .55s .08s cubic-bezier(.2,1.3,.4,1) both; }
.stage-chapter-note { margin: 0; color: var(--ink-soft); font-size: clamp(17px, 2.2vw, 26px); animation: stage-pop .55s .16s cubic-bezier(.2,1.3,.4,1) both; }
@keyframes stage-pop { from { opacity: 0; transform: scale(.86) translateY(14px); } to { opacity: 1; transform: none; } }

.stage-list { display: grid; gap: clamp(12px, 1.8vh, 20px); margin: clamp(18px, 3vh, 30px) 0 0; padding: 0; list-style: none; }
.stage-list li { position: relative; padding: clamp(16px, 2.4vh, 24px) clamp(18px, 2.6vw, 28px) clamp(16px, 2.4vh, 24px) clamp(52px, 6vw, 68px); border-radius: 18px; background: white; box-shadow: 0 3px 14px rgba(11,64,74,.08); font-size: clamp(19px, 2.5vw, 28px); font-weight: 700; line-height: 1.5; }
.stage-list li::before { content: counter(list-item); position: absolute; left: clamp(16px, 2vw, 22px); top: 50%; display: grid; place-items: center; width: clamp(28px, 3.2vw, 36px); height: clamp(28px, 3.2vw, 36px); transform: translateY(-50%); border-radius: 50%; color: white; background: var(--mint-deep); font-size: clamp(15px, 1.8vw, 19px); }

.stage-wonder { display: grid; justify-items: center; text-align: center; }
.stage-question { max-width: 20ch; margin: 0; padding: clamp(22px, 4vh, 40px) clamp(24px, 4vw, 44px); border-radius: 26px; background: #fffaec; box-shadow: 0 4px 20px rgba(180,140,20,.12); font-size: clamp(28px, 4.6vw, 52px); line-height: 1.4; }

.stage-options { display: grid; gap: clamp(10px, 1.6vh, 16px); margin: clamp(18px, 3vh, 28px) 0 0; }
.stage-option { display: flex; align-items: center; gap: clamp(12px, 1.6vw, 18px); min-height: clamp(64px, 9vh, 88px); padding: clamp(12px, 1.8vh, 18px) clamp(16px, 2.4vw, 24px); border: 3px solid #dfe8e6; border-radius: 20px; background: white; cursor: pointer; font-size: clamp(18px, 2.4vw, 26px); font-weight: 700; text-align: left; }
.stage-option:hover, .stage-option.selected { border-color: var(--mint-deep); background: #edfaf5; }
.stage-option i { display: grid; place-items: center; flex: 0 0 auto; width: clamp(34px, 4vw, 44px); height: clamp(34px, 4vw, 44px); border: 3px solid #b6c9c5; border-radius: 50%; font-style: normal; font-size: clamp(16px, 2vw, 22px); }
.stage-option.selected i { border-color: var(--mint-deep); color: white; background: var(--mint-deep); }
.stage-safety { margin: clamp(16px, 2.4vh, 24px) 0 0; padding: clamp(12px, 1.8vh, 18px) clamp(14px, 2vw, 20px); border-left: 5px solid var(--coral); border-radius: 0 14px 14px 0; background: #fff2ee; font-size: clamp(15px, 1.8vw, 20px); line-height: 1.65; }

.stage-verdict { display: grid; gap: clamp(10px, 1.6vh, 16px); margin-top: clamp(16px, 2.6vh, 26px); }
.stage-verdict section { padding: clamp(14px, 2vh, 20px) clamp(16px, 2.2vw, 22px); border-radius: 18px; background: white; box-shadow: 0 3px 14px rgba(11,64,74,.07); }
.stage-verdict section p { margin: 0; font-size: clamp(17px, 2.1vw, 23px); line-height: 1.65; }
.stage-verdict .held { border-left: 6px solid var(--mint-deep); }
.stage-verdict .revised { border-left: 6px solid var(--yellow); }
.stage-data { margin-top: clamp(12px, 2vh, 18px); padding: clamp(14px, 2vh, 20px) clamp(16px, 2.2vw, 22px); border-radius: 18px; background: #eef4fb; }
.stage-table { width: 100%; margin-top: 8px; border-collapse: collapse; }
.stage-table th, .stage-table td { padding: clamp(10px, 1.4vh, 14px) 4px; border-bottom: 1px solid #d7e2ec; font-size: clamp(17px, 2.1vw, 23px); text-align: left; }
.stage-table th { font-weight: 600; color: var(--ink-soft); }
.stage-table td { font-weight: 800; text-align: right; }
.stage-table tr:last-child th, .stage-table tr:last-child td { border-bottom: 0; }
.stage-feedback { margin: clamp(14px, 2vh, 20px) 0 0; padding: clamp(14px, 2vh, 20px) clamp(16px, 2.2vw, 22px); border-left: 6px solid var(--coral); border-radius: 0 16px 16px 0; background: #fff2ee; font-size: clamp(17px, 2.1vw, 23px); line-height: 1.7; }
.stage-feedback.right { border-left-color: var(--mint-deep); background: #edfaf5; }

.stage-foot { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.stage-dots { display: flex; gap: 8px; }
.stage-dots[hidden] { visibility: hidden; display: flex; }
.stage-dots i { width: 10px; height: 10px; border-radius: 50%; background: #c6d9d5; }
.stage-dots i.on { background: var(--mint-deep); }
.stage-next { min-height: clamp(56px, 8vh, 72px); padding: 0 clamp(28px, 4vw, 46px); border: 0; border-radius: 999px; color: #3a2b00; background: var(--yellow); box-shadow: 0 5px 0 #d8ab19; cursor: pointer; font-size: clamp(18px, 2.2vw, 24px); font-weight: 800; }
.stage-next:disabled { opacity: .45; box-shadow: none; cursor: not-allowed; }
.stage-next[hidden] { display: none; }

@media (prefers-reduced-motion: reduce) {
  .stage-body.entering, .stage-chapter-step, .stage-chapter-title, .stage-chapter-note { animation: none; }
}

.air-readout-heading > span { margin-right: auto; font-weight: 700; }
.air-readout-heading i { width: 5px; height: 5px; border-radius: 50%; background: #718d87; }
.air-readout-heading small { color: #788891; font: 600 9px system-ui,sans-serif; letter-spacing: .15em; }
.air-readings { display: grid; grid-template-columns: .8fr 1.2fr; gap: 10px; margin: 15px 0 11px; }
.air-readings > div > span { display: block; color: #6c7885; font-size: 11px; }
.air-readings strong { display: block; margin-top: 7px; font: 500 33px/1.1 'Segoe UI',system-ui,sans-serif; letter-spacing: -.035em; font-variant-numeric: tabular-nums; }
.air-readings strong small { margin-left: 4px; color: #76828b; font: 500 12px system-ui,sans-serif; }
.air-readout[data-bath="hot"] [data-reading="volume"] { color: #b96134; }
.air-readout[data-bath="ice"] [data-reading="volume"] { color: #347a9a; }
.air-readout > p { min-height: 16px; margin: 0; font-size: 11px; font-weight: 600; }
.air-readout footer { margin-top: 12px; padding-top: 10px; border-top: 1px solid #d7dde0; color: #81909b; font-size: 10px; }
.language-row { margin-bottom: 18px; }
.language-row select { max-width: 150px; }
@media (max-width: 820px) {
  .mission-panel { right: 16px; }
  .air-readout { width: 230px; }
}
@media (max-width: 620px) {
  :root { --topbar-h: 66px; }
  .topbar { padding: 10px 15px; }
  .brand-button { gap: 9px; }
  .brand-button b { font-size: 16px; }
  .brand-button small { display: block; font-size: 8px; }
  .brand-mark { width: 36px; height: 36px; border-radius: 8px; }
  .brand-mark svg { width: 27px; height: 27px; }
  .progress-chip { display: none; }
  .icon-button { width: 36px; height: 36px; border-radius: 8px; }
  .topbar-actions { gap: 6px; }
  .lab-heading { top: 86px; left: 16px; }
  .lab-title-block h1 { font-size: 25px; }
  .air-readout { top: 134px; left: 16px; width: calc(100% - 32px); padding: 11px 14px; }
  .air-readout-heading { padding-bottom: 0; border: 0; font-size: 11px; }
  .air-readings { margin: 9px 0 7px; grid-template-columns: 1fr 1.25fr; }
  .air-readings > div { display: flex; align-items: baseline; justify-content: space-between; gap: 6px; }
  .air-readings strong { margin: 0; font-size: 25px; }
  .air-readings strong small { font-size: 10px; }
  .air-readings > div > span { font-size: 10px; }
  .air-readout footer { display: none; }
  .air-readout > p { font-size: 10px; }
  html[lang="en-US"] .air-readings > div { display: block; }
  html[lang="en-US"] .air-readings strong { margin-top: 3px; }
  .air-label { min-height: 32px; padding: 6px 9px; gap: 5px; font-size: 14px; border-radius: 6px; }
  .air-label i { width: 5px; height: 5px; }
  .mission-panel, .mission-panel.collapsed { top: auto; bottom: 16px; right: 16px; }
  .mission-panel.collapsed { padding: 0; }
  .mission-panel-toggle { border-radius: 8px 0 0 8px; }
  .mission-panel.collapsed .mission-panel-toggle { top: auto; bottom: 0; width: min(270px,calc(100vw - 166px)); height: 54px; border-radius: 10px; padding-inline: 9px; gap: 6px; }
  .mission-toggle-copy b { font-size: 12px; }
  .view-controls { left: 16px; bottom: 16px; }
  .view-controls button { width: 36px; height: 40px; }
  .record-panel { z-index: 31; bottom: 88px; }
  .variable-control, .observation-strip { bottom: 88px; }
  .variable-control { width: calc(100% - 32px); grid-template-columns: auto minmax(80px,1fr) auto; gap: 8px; }
  .glass-dialog { border-radius: 12px; }
}
@media (max-height: 600px) and (min-width: 621px) {
  .air-readout { top: 132px; width: 220px; padding: 12px 14px; }
  .air-readout footer { display: none; }
  .air-readings strong { font-size: 27px; }
  .lab-heading { top: 88px; }
}

</style>
</head>
  <body>
    <a class="skip-link" href="#mainContent" data-i18n="sl.skipLink">跳到主要內容</a>
    <canvas id="labCanvas" aria-label="互動式 3D 科學實驗場景" data-i18n-attr="aria-label:sl.canvasAria"></canvas>

    <div id="bootScreen" class="boot-screen" role="status" aria-live="polite">
      <div class="boot-symbol" aria-hidden="true"><span>air</span><i>°</i></div>
      <p class="eyebrow">AIR LAB</p>
      <h1 data-i18n="sl.brand">空氣研究所</h1>
      <p id="bootMessage" data-i18n="sl.booting">正在準備 3D 實驗室…</p>
      <div class="boot-meter"><span id="bootMeterFill"></span></div>
    </div>

    <header id="topbar" class="topbar" hidden>
      <div class="brand-button">
        <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 48 48"><circle cx="17" cy="25" r="8"/><circle cx="30" cy="23" r="12"/><path d="M23 12l4-3-1 5M32 34l-4 3 1-5"/></svg></span>
        <span><b data-i18n="sl.brand">空氣研究所</b><small>AIR LAB</small></span>
      </div>
      <div class="topbar-actions">
        <div id="progressChip" class="progress-chip" aria-label="完成進度" data-i18n-attr="aria-label:sl.progressAria">
          <span class="progress-ring"><i id="progressRing"></i></span>
          <span><b id="progressCount">0 / 1</b><small data-i18n="sl.completed">已完成</small></span>
        </div>
        <button id="soundButton" class="icon-button" type="button" aria-label="關閉聲音" aria-pressed="true" title="聲音" data-i18n-attr="aria-label:sl.soundOff;title:sl.sound">
          <svg class="sound-on" viewBox="0 0 24 24"><path d="M5 9v6h4l5 4V5L9 9z"/><path d="M17 8a5 5 0 0 1 0 8M19 5a9 9 0 0 1 0 14"/></svg>
          <svg class="sound-off" viewBox="0 0 24 24"><path d="M5 9v6h4l5 4V5L9 9zM18 9l4 4M22 9l-4 4"/></svg>
        </button>
        <button id="settingsButton" class="icon-button" type="button" aria-label="設定" title="設定" data-i18n-attr="aria-label:sl.settings;title:sl.settings">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6V21h-4v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L4.2 17l.1-.1A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.6-1H3v-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L4.2 7 7 4.2l.1.1A1.7 1.7 0 0 0 9 4.6 1.7 1.7 0 0 0 10 3V3h4v.1a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.1v4H21a1.7 1.7 0 0 0-1.6 1z"/></svg>
        </button>
      </div>
    </header>

    <main id="mainContent" hidden>

      <section id="labScreen" class="lab-screen" hidden aria-labelledby="labTitle">
        <div class="lab-heading">
          <div class="lab-title-block">
            <div><h1 id="labTitle"></h1></div>
          </div>
        </div>

        <aside id="missionPanel" class="mission-panel collapsed" aria-live="polite">
          <button id="missionPanelToggle" class="mission-panel-toggle" type="button" aria-expanded="false" aria-controls="missionPanelBody" aria-label="展開任務卡" data-i18n-attr="aria-label:sl.expandMission">
            <span class="mission-toggle-arrow" aria-hidden="true">‹</span>
            <span class="mission-toggle-copy" aria-hidden="true">
              <small id="missionPeekStep"></small>
              <b id="missionPeekTitle" data-i18n="sl.peekTitle">查看今步任務</b>
            </span>
          </button>
          <div id="missionPanelBody" class="mission-panel-body">
          <div class="mission-progress">
            <span id="stepLabel"></span>
            <div><i id="stepProgress"></i></div>
          </div>
          <p id="missionVerb" class="mission-verb"></p>
          <h2 id="missionTitle"></h2>
          <p id="missionInstruction"></p>
          <div id="missionCue" class="mission-cue">
            <span class="cue-hand" aria-hidden="true">☝</span><span data-i18n="sl.cueDrag">拖動有光圈的器材</span>
          </div>
          <div class="mission-actions">
            <button id="hintButton" class="hint-button" type="button">
              <svg viewBox="0 0 24 24"><path d="M9 18h6M10 22h4M8.5 14.5A6 6 0 1 1 15.5 14c-.8.7-1.5 1.6-1.5 2.5h-4c0-.8-.7-1.5-1.5-2z"/></svg><span data-i18n="sl.hintButton">提示</span>
            </button>
            <button id="accessibleActionButton" class="accessible-action-button" type="button" data-i18n="sl.accessible">按鈕操作</button>
            <button id="resetButton" class="reset-button" type="button" data-i18n="sl.restart">重新開始</button>
          </div>
          <div id="hintBox" class="hint-box" hidden></div>
          </div>
        </aside>

        <div id="variableControl" class="variable-control" hidden>
          <label id="variableLabel" for="variableSlider" data-i18n="sl.variableLabel">角度</label>
          <output id="variableValue">0°</output>
          <input id="variableSlider" type="range" min="0" max="100" value="0" />
        </div>

        <div id="recordPanel" class="record-panel" hidden>
          <p class="section-kicker" data-i18n="sl.recordKicker">記錄數據 · RECORD</p>
          <b id="recordLabel" data-i18n="sl.reading">讀數</b>
          <div id="recordOptions" class="record-options" role="radiogroup" aria-label="選擇讀數" data-i18n-attr="aria-label:sl.recordAria"></div>
        </div>

        <div id="observationStrip" class="observation-strip" hidden aria-live="polite">
          <span class="observation-icon" aria-hidden="true">◎</span>
          <div><b data-i18n="sl.observePrompt">觀察到甚麼？</b><p id="observationText"></p></div>
        </div>

        <div id="interactionLabel" class="interaction-label" hidden></div>
        <div class="view-controls" aria-label="3D 視角控制" data-i18n-attr="aria-label:sl.viewAria">
          <button id="cameraLeftButton" type="button" aria-label="視角向左轉" data-i18n-attr="aria-label:sl.viewLeft">↶</button>
          <button id="cameraResetButton" type="button" aria-label="重設視角" data-i18n-attr="aria-label:sl.viewReset">⌂</button>
          <button id="cameraRightButton" type="button" aria-label="視角向右轉" data-i18n-attr="aria-label:sl.viewRight">↷</button>
        </div>

        <section id="phenomenonStage" class="phenomenon-stage" role="status" aria-live="assertive" hidden>
          <div class="phenomenon-focus" aria-hidden="true"></div>
          <div class="phenomenon-caption">
            <span class="phenomenon-mark" aria-hidden="true">◎</span>
            <div class="phenomenon-copy">
              <p class="section-kicker" data-i18n="sl.observeKicker">先看現象 · OBSERVE</p>
              <h2 id="phenomenonTitle" data-i18n="sl.watchResult">留心觀看實驗結果</h2>
              <p id="phenomenonText"></p>
              <div id="phenomenonComparison" class="phenomenon-comparison" hidden></div>
            </div>
            <div class="phenomenon-actions">
              <span id="phenomenonCountdown"></span>
              <button id="phenomenonExplainButton" type="button" data-i18n="sl.explainNow">立即看解釋</button>
            </div>
            <i id="phenomenonTimerBar" class="phenomenon-timer" aria-hidden="true"></i>
          </div>
        </section>
      </section>
    </main>

    <section id="stageScreen" class="stage-screen" hidden>
      <div class="stage-inner">
        <p id="stageKicker" class="stage-kicker"></p>
        <div id="stageBody" class="stage-body"></div>
        <div class="stage-foot">
          <div id="stageDots" class="stage-dots" aria-hidden="true"></div>
          <button id="stageNext" class="stage-next" type="button" data-i18n="sl.continue">繼續</button>
        </div>
      </div>
    </section>

    <dialog id="resultDialog" class="glass-dialog result-dialog" aria-labelledby="resultTitle">
      <div class="result-burst" aria-hidden="true"><span>★</span></div>
      <p class="section-kicker" data-i18n="sl.explainKicker">第五步 · 科學解釋 EXPLAIN</p>
      <h2 id="resultTitle" data-i18n="sl.resultTitle">發現密度的秘密！</h2>
      <div class="result-score"><span id="resultStars">★★★</span><small id="resultScoreText" data-i18n="sl.resultScoreDefault">獨立完成</small></div>
      <div class="result-grid">
        <section><span class="result-label" data-i18n="sl.labelHypothesis">你的假說</span><p id="resultPrediction"></p></section>
        <section><span class="result-label" data-i18n="sl.labelObservation">實驗觀察</span><p id="resultObservation"></p></section>
        <section id="resultComparison" class="result-comparison" hidden>
          <span class="result-label" data-i18n="sl.labelComparison">對照比較</span>
          <div class="comparison-values">
            <div><small id="comparisonLeftLabel"></small><b id="comparisonLeftValue"></b></div>
            <span aria-hidden="true">↔</span>
            <div><small id="comparisonRightLabel"></small><b id="comparisonRightValue"></b></div>
          </div>
          <p id="comparisonConclusion"></p>
        </section>
        <section class="result-explain"><span class="result-label" data-i18n="sl.labelExplanation">科學解釋</span><p id="resultExplanation"></p></section>
      </div>
      <div class="curriculum-link"><b id="resultCodes"></b><span data-i18n="sl.curriculumNote">本模組原創實驗，參考建議教具表的相關編碼；並非完整課程或評核清單。</span></div>
      <div class="result-actions">
        <button id="replayButton" class="secondary-button" type="button" data-i18n="sl.replay">再做一次</button>
      </div>
    </dialog>

    <dialog id="settingsDialog" class="glass-dialog settings-dialog" aria-labelledby="settingsTitle">
      <button class="dialog-close" data-close-dialog type="button" aria-label="關閉" data-i18n-attr="aria-label:sl.close">×</button>
      <p class="section-kicker">LAB SETTINGS</p>
      <h2 id="settingsTitle" data-i18n="sl.settingsTitle">實驗室設定</h2><div class="quality-row language-row"><label for="languageSelect"><b data-i18n="air.language">語言／Language</b><small data-i18n="air.languageHint">介面和實驗內容語言</small></label><select id="languageSelect"><option value="zh-HK">繁體中文</option><option value="en-US">English</option></select></div>
      <label class="toggle-row"><span><b data-i18n="sl.soundLabel">音效</b><small data-i18n="sl.soundHint">操作、成功和環境聲音</small></span><input id="soundToggle" type="checkbox" checked /><i></i></label>
      <label class="toggle-row"><span><b data-i18n="sl.motionLabel">減少動態</b><small data-i18n="sl.motionHint">減少非必要鏡頭和粒子動畫</small></span><input id="motionToggle" type="checkbox" /><i></i></label>
      <label class="toggle-row"><span><b data-i18n="sl.contrastLabel">高對比提示</b><small data-i18n="sl.contrastHint">加強可操作器材的輪廓</small></span><input id="contrastToggle" type="checkbox" /><i></i></label>
      <div class="quality-row"><label for="qualitySelect"><b data-i18n="sl.qualityLabel">3D 畫質</b><small data-i18n="sl.qualityHint">低階平板建議選「流暢」</small></label><select id="qualitySelect"><option value="auto" data-i18n="sl.qualityAuto">自動</option><option value="high" data-i18n="sl.qualityHigh">精緻</option><option value="low" data-i18n="sl.qualityLow">流暢</option></select></div>
    </dialog>

    <div id="toastRegion" class="toast-region" aria-live="assertive"></div>
    <div id="screenFlash" class="screen-flash" aria-hidden="true"></div>
  
<!-- Runtime is bundled in air-expansion.html. -->
</body>
</html>
