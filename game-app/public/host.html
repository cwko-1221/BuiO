<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="g.hostPageTitle">遊戲主持台 | BuiO</title>
  <script src="/shared/i18n.js?v=20260910-1"></script>
  <script src="/shared/server-i18n.js?v=20260910-1"></script>
  <script src="/shared/i18n/game.js?v=20260910-1"></script>
  <script>if(new URLSearchParams(location.search).get('hub')==='1')document.documentElement.classList.add('hub-launch');</script>
  <style>html.hub-launch #setupScreen{display:none!important}html.hub-launch #lobbyScreen{display:flex!important}</style>
  <link rel="stylesheet" href="/game/css/game.css?v=20260818-touch-1">
</head>
<body>

  <!-- ============ SETUP ============ -->
  <div id="setupScreen" class="screen active">
    <div class="host-shell">
      <div class="host-topbar">
        <h1 data-i18n="g.hostTitle">🏔️ 唔好望落嚟 — 主持台</h1>
        <a class="icon-btn" href="/" data-i18n="g.home">🏠 回主頁</a>
      </div>
      <div class="host-grid">
        <div class="host-card">
          <h2 data-i18n="g.hostStep1">1️⃣ 選擇題庫</h2>
          <div id="setList"><p class="muted" data-i18n="g.loading">載入中…</p></div>
          <button id="newSetBtn" class="btn secondary" style="margin-top:10px" data-i18n="g.newBank">➕ 新增題庫</button>
        </div>
        <div class="host-card">
          <h2 data-i18n="g.hostStep2">2️⃣ 遊戲設定</h2>
          <div class="field">
            <label data-i18n="g.duration">遊戲時間</label>
            <select id="durationSelect">
              <option value="300" data-i18n="g.min5">5 分鐘</option>
              <option value="480" selected data-i18n="g.min8">8 分鐘</option>
              <option value="600" data-i18n="g.min10">10 分鐘</option>
              <option value="900" data-i18n="g.min15">15 分鐘</option>
            </select>
          </div>
          <div class="settings-pair">
            <div class="field">
              <label for="maxEnergyInput" data-i18n="g.maxEnergy">最高能量</label>
              <input id="maxEnergyInput" type="number" min="20" max="500" step="5" value="100">
            </div>
            <div class="field">
              <label for="energyPerCorrectInput" data-i18n="g.energyPerQ">每題增加能量</label>
              <input id="energyPerCorrectInput" type="number" min="1" max="100" step="1" value="25">
            </div>
          </div>
          <label class="toggle-row" for="infiniteEnergyToggle">
            <span>
              <strong data-i18n="g.infiniteEnergy">無限能量</strong>
              <small data-i18n="g.infiniteEnergyHint">玩家移動及跳躍時不會消耗能量</small>
            </span>
            <span class="toggle-control">
              <input id="infiniteEnergyToggle" type="checkbox">
              <span class="toggle-track" aria-hidden="true"></span>
            </span>
          </label>
          <button id="createRoomBtn" class="btn" disabled data-i18n="g.createRoom">🚀 建立遊戲房間</button>
          <div id="setupError" class="error-msg"></div>
          <div style="margin-top:16px; font-size:14px; color:#6b7690; background:#f5f8fc; border-radius:12px; padding:14px;">
            <span data-i18n-html="g.hostNote">學生喺自己嘅裝置爬山：答問題儲 ⚡能量，用能量移動同跳躍。<br>
            最快到山頂（或者時間結束時爬得最高）嘅學生獲勝 🏆</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ============ SET EDITOR ============ -->
  <div id="editorScreen" class="screen">
    <div class="host-shell" style="max-width:760px">
      <div class="host-topbar">
        <h1 id="editorTitle" data-i18n="g.editorNew">✏️ 新增題庫</h1>
        <button class="icon-btn" id="editorBackBtn" data-i18n="g.back">← 返回</button>
      </div>
      <div class="host-card">
        <div class="field">
          <label data-i18n="g.bankName">題庫名稱</label>
          <input id="editorSetTitle" type="text" maxlength="60" placeholder="例如：三年級數學 第二課" data-i18n-attr="placeholder:g.bankNamePh">
        </div>
        <div class="excel-toolbar">
          <input id="excelImportInput" type="file" accept=".xlsx" hidden>
          <button id="excelImportBtn" class="btn secondary small" type="button" data-i18n="g.importExcel">📥 Excel 匯入</button>
          <button id="excelTemplateBtn" class="btn secondary small" type="button" data-i18n="g.downloadTemplate">⬇️ 下載 Excel 範本</button>
          <span id="excelImportStatus" class="muted" data-i18n="g.excelHint">支援 .xlsx，每列一題</span>
        </div>
        <div id="editorQuestions"></div>
        <div class="editor-actions">
          <button id="addQuestionBtn" class="btn secondary small" data-i18n="g.addQuestion">➕ 加題目</button>
          <div style="flex:1"></div>
          <button id="saveSetBtn" class="btn small" data-i18n="g.saveBank">💾 儲存題庫</button>
        </div>
        <div id="editorError" class="error-msg"></div>
      </div>
    </div>
  </div>

  <!-- ============ LOBBY ============ -->
  <div id="lobbyScreen" class="screen">
    <div class="panel-center">
      <div class="card" style="max-width:620px">
        <div class="game-logo">⛺</div>
        <h1 id="lobbyTitle" data-i18n="g.roomReady">房間已建立</h1>
        <p class="join-hint" data-i18n-html="g.joinHint">學生入 <b>主頁 → 遊戲</b> 就會見到你嘅房間，撳一下就加入</p>
        <p class="sub" id="lobbyInfo" data-i18n="g.creatingRoom">正在建立房間…</p>
        <div class="roster" id="lobbyRoster"><span class="muted" data-i18n="g.waitingStudents">等待學生加入…</span></div>
        <button id="startGameBtn" class="btn" disabled data-i18n="g.startGame">▶️ 開始遊戲</button>
        <button id="cancelRoomBtn" class="btn secondary" style="margin-top:8px" data-i18n="g.cancelRoom">取消房間</button>
        <div id="lobbyError" class="error-msg"></div>
      </div>
    </div>
  </div>

  <!-- ============ LIVE BOARD ============ -->
  <div id="liveScreen" class="screen">
    <div class="host-shell">
      <div class="host-topbar">
        <h1 data-i18n="g.liveTitle">🏔️ 比賽進行中</h1>
        <div class="hud-pill" style="background:#1f2a44;color:#fff;font-weight:800;padding:8px 16px;border-radius:999px" id="liveTimer">--:--</div>
        <button class="icon-btn" id="endGameBtn" style="color:var(--coral);border-color:#ffd2d2" data-i18n="g.endGame">⏹ 結束遊戲</button>
      </div>
      <div class="host-card">
        <div class="board-wrap">
          <canvas id="mountainCanvas" width="130" height="480"></canvas>
          <div class="live-list" id="liveList"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- ============ RESULTS ============ -->
  <div id="resultScreen" class="screen">
    <div class="panel-center">
      <div class="card" style="max-width:560px">
        <div class="game-logo">🏆</div>
        <h1 data-i18n="g.finalRanking">最終排名</h1>
        <p class="sub" id="resultReason"></p>
        <div id="resultsList" class="results-list"></div>
        <button class="btn" id="playAgainBtn" data-i18n="g.playAgain">🔄 再玩一場</button>
        <button class="btn secondary" style="margin-top:8px" onclick="location.href='/'" data-i18n="g.home">🏠 回主頁</button>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/game/js/host.js?v=20260802-unified-launch-1"></script>
</body>
</html>
