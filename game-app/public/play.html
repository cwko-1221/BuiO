<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>唔好望落嚟 | BuiO 遊戲</title>
  <link rel="stylesheet" href="/game/css/game.css?v=20260717-recovery-audio">
</head>
<body>

  <!-- ============ JOIN ============ -->
  <div id="joinScreen" class="screen active">
    <div class="panel-center">
      <div class="card">
        <div class="game-logo">🏔️</div>
        <h1>唔好望落嚟</h1>
        <p class="sub">答問題儲能量，一路跳上山頂！千祈唔好望落嚟……</p>
        <div id="roomList" class="room-list">
          <p class="muted"><span class="pulse-dot"></span>搵緊老師嘅遊戲房間…</p>
        </div>
        <div id="joinError" class="error-msg"></div>
        <button class="btn secondary" style="margin-top:8px" onclick="location.href='/'">🏠 回主頁</button>
      </div>
    </div>
  </div>

  <!-- ============ LOBBY ============ -->
  <div id="lobbyScreen" class="screen">
    <div class="panel-center">
      <div class="card">
        <div class="game-logo">⛺</div>
        <h1 id="lobbySetTitle">準備中</h1>
        <p class="sub" id="lobbyHostName"></p>
        <p class="lobby-wait"><span class="pulse-dot"></span>等緊老師開始遊戲…</p>
        <div style="margin-top:20px; font-size:14px; color:#6b7690; text-align:left; background:#f5f8fc; border-radius:12px; padding:14px;">
          <b>玩法：</b><br>
          🕹️ 左右移動 + 跳躍會消耗 ⚡能量<br>
          📝 隨時撳「答題」，答啱補充能量<br>
          🏔️ 最快爬上山頂就贏！跌落嚟要再爬過…
        </div>
      </div>
    </div>
  </div>

  <!-- ============ GAME ============ -->
  <div id="gameScreen" class="screen">
    <div id="gameCanvas" tabindex="-1" aria-label="唔好望落嚟遊戲世界"></div>

    <div class="hud">
      <div class="hud-cluster hud-cluster-primary">
        <div class="energy-wrap" aria-label="能量">
          <span class="energy-icon">⚡</span>
          <div class="energy-copy"><small>能量</small><strong id="energyText">40</strong></div>
          <div class="energy-bar"><div id="energyFill" class="energy-fill"></div></div>
        </div>
        <div class="hud-pill altitude-pill" id="heightPill">🏔️ 高度 0m</div>
        <div class="hud-pill stage-pill" id="stagePill">01 · 城堡</div>
      </div>
      <div class="spacer"></div>
      <div class="hud-cluster hud-cluster-secondary">
        <button class="audio-toggle-btn" id="audioBtn" type="button" aria-label="關閉遊戲聲音" aria-pressed="false">🔊</button>
        <button class="reset-position-btn" id="resetBtn" type="button" aria-label="返回最近檢查點">↻ 復位</button>
        <div class="hud-pill streak-pill" id="streakPill" style="display:none">🔥 0</div>
        <div class="hud-pill timer-pill" id="timerPill">--:--</div>
      </div>
    </div>

    <div id="toasts"></div>

    <button id="answerBtn" class="answer-btn-float" aria-label="答題補充能量"><span class="zap">⚡</span><span>答題</span><small>補充能量</small></button>

    <div class="touch-controls">
      <div class="cluster">
        <button class="tbtn" id="btnLeft">◀</button>
        <button class="tbtn tbtn-down" id="btnDown">▼</button>
        <button class="tbtn" id="btnRight">▶</button>
      </div>
      <div class="cluster">
        <button class="tbtn" id="btnJump">⬆</button>
      </div>
    </div>

    <!-- question modal -->
    <div id="qOverlay" class="q-overlay">
      <div class="q-box">
        <div id="qText" class="q-text"></div>
        <div id="qChoices" class="q-choices"></div>
        <div id="qFeedback" class="q-feedback"></div>
        <button id="qClose" class="btn secondary q-close" style="display:none">繼續爬山 🧗</button>
      </div>
    </div>
  </div>

  <!-- ============ RESULTS ============ -->
  <div id="resultScreen" class="screen">
    <div class="panel-center">
      <div class="card" style="max-width:540px">
        <div class="game-logo" id="resultEmoji">🏁</div>
        <h1>遊戲結束</h1>
        <p class="sub" id="resultSub"></p>
        <div id="resultsList" class="results-list"></div>
        <button class="btn" onclick="location.href='/'">🏠 回主頁</button>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/game/vendor/phaser/phaser.min.js"></script>
  <script type="module" src="/game/js/v2/main.js?v=20260718-network-3"></script>
</body>
</html>
