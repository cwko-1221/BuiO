<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title data-i18n="e.studentTitle">學生練習 ・ 英文拼字</title>
  <script src="/shared/i18n.js?v=20260910-1"></script>
  <script src="/shared/i18n/english.js?v=20260910-1"></script>
  <link rel="stylesheet" href="/chinese/css/style.css" />
  <style>
    .topbar::before { content: 'E'; background: linear-gradient(135deg, #f59e0b, #ef4444); }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="/english/js/common.js"></script>
  <script>
    const { api, el, toast, fmtDate, renderTopbar, ensureAuth } = EnglishApp;
    const t = BuiI18n.t;
    const root = document.getElementById('root');

    async function init() {
      const me = await ensureAuth('student');
      if (!me) return;
      root.appendChild(renderTopbar({ title: t('e.platform'), user: me }));
      const container = el('div', { class: 'container narrow' });
      container.appendChild(el('div', { class: 'page-head' },
        el('h1', {}, `Hi, ${me.name}`),
        el('p', {}, t('e.pickPractice'))
      ));
      root.appendChild(container);

      container.appendChild(el('p', { class: 'muted' }, t('e.loadingWork')));
      try {
        const { assignments } = await api('/api/english/student/assignments');
        container.innerHTML = '';
        container.appendChild(el('div', { class: 'page-head' },
          el('h1', {}, `Hi, ${me.name}`),
          el('p', {}, t('e.pickPractice'))
        ));
        if (!assignments.length) {
          container.appendChild(el('div', { class: 'card empty' }, t('e.noWork')));
          return;
        }
        const pending = assignments.filter(a => !a.attempt || a.attempt.status !== 'completed');
        const done = assignments.filter(a => a.attempt && a.attempt.status === 'completed');
        if (pending.length) {
          container.appendChild(el('h2', { style: { margin: '8px 0' } }, t('e.pending')));
          for (const a of pending) container.appendChild(renderCard(a));
        }
        if (done.length) {
          container.appendChild(el('h2', { style: { margin: '20px 0 8px' } }, t('e.done')));
          for (const a of done) container.appendChild(renderCard(a));
        }
      } catch (e) { toast(e.message, 'error'); }
    }

    function renderCard(a) {
      const score = a.attempt ? `${a.attempt.score}/5` : '—';
      return el('div', {
        class: 'assignment-card',
        onclick: () => location.href = `/english/practice?assignmentId=${a.id}`,
      },
        el('div', {},
          el('div', { class: 'title' }, a.title),
          el('div', { class: 'sub' }, t('e.cardMeta', { label: a.targetLabel, date: fmtDate(a.createdAt) }))
        ),
        el('div', { class: 'score' }, score)
      );
    }

    init().catch(e => toast(e.message, 'error'));
  </script>
</body>
</html>
