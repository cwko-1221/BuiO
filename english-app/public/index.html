<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
    <link rel="stylesheet" href="/shared/loading.css?v=20261011-1">
    <script src="/shared/loading.js?v=20261011-1"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title data-i18n="e.loadingTitle">英文拼字 ・ 載入中</title>
  <script src="/shared/i18n.js?v=20260910-1"></script>
  <script src="/shared/i18n/english.js?v=20260910-1"></script>
  <link rel="stylesheet" href="/chinese/css/style.css" />
  <style>
    .topbar::before { content: 'E'; background: linear-gradient(135deg, #f59e0b, #ef4444); }
  </style>
</head>
<body>
  <div class="container narrow" style="padding-top: 80px; text-align: center;">
    <p class="muted" data-i18n="e.loading">載入中…</p>
  </div>
  <script src="/english/js/common.js"></script>
  <script>
    (async () => {
      const me = await EnglishApp.getMe();
      if (!me) { location.replace('/'); return; }
      if (me.role === 'teacher') location.replace('/english/teacher');
      else location.replace('/english/student');
    })().catch(error => window.BuiLoading.recover(error));
  </script>
</body>
</html>
