<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="國小四則運算適性學習系統 - 登入頁面" data-i18n-attr="content:m.loginDesc">
    <title data-i18n="m.loginTitle">登入 ✦ 杯澳四則特訓</title>
    <script src="/shared/i18n.js?v=20260910-1"></script>
    <script src="/shared/i18n/math.js?v=20260910-1"></script>
    <link rel="stylesheet" href="/math-app/css/style.css?v=20260910-i18n-1">
    <style>
        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            color: var(--text-muted);
            font-size: 1.2rem;
            cursor: pointer;
            transition: color var(--transition-base);
        }
        .back-btn:hover { color: var(--text-primary); }
    </style>
</head>
<body>
    <div class="page-container">
        <div class="login-wrapper" style="position: relative;">
            <a href="/" class="back-btn" title="回首頁" data-i18n-attr="title:m.backHome">⬅️</a>
            <div class="login-card glass-card-static" id="login-card">
                <img src="/math-app/images/logo.png" alt="校徽" class="login-img" data-i18n-attr="alt:m.logoAlt">
                <h1 class="login-title" data-i18n="m.loginHeading">系統登入</h1>
                <p class="login-subtitle" data-i18n="m.loginLead">請輸入您的學號或教師帳號</p>

                <div class="login-error" id="login-error"></div>

                <form class="login-form" id="login-form">
                    <div class="form-group">
                        <label class="form-label" for="student-id" data-i18n="m.accountLabel">帳號</label>
                        <input type="text" class="form-input" id="student-id" 
                               placeholder="請輸入帳號 (例: S001 或 T001)" data-i18n-attr="placeholder:m.accountPh" autocomplete="off" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="password" data-i18n="m.passwordLabel">密碼</label>
                        <input type="password" class="form-input" id="password" 
                               placeholder="請輸入密碼" data-i18n-attr="placeholder:m.passwordPh" required>
                    </div>

                    <button type="submit" class="btn btn-primary btn-lg btn-block" id="login-btn">
                        <span data-i18n="m.loginBtn">🚀 登入</span>
                    </button>
                </form>

                <div class="login-footer">
                    <p data-i18n="m.loginFooter">學生：S001 ~ S005 ｜ 老師：T001 (密碼皆為 123456)</p>
                </div>
            </div>
        </div>
    </div>

    <script src="/math-app/js/login.js?v=20260910-i18n-1"></script>
</body>
</html>
