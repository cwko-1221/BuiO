<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="杯澳四則特訓 - 四則運算練習" data-i18n-attr="content:m.quizDesc">
    <title data-i18n="m.quizTitle">練習中 ✦ 杯澳四則特訓</title>
    <script src="/shared/i18n.js?v=20260910-1"></script>
    <script src="/shared/i18n/math.js?v=20260919-keypad-1"></script>
    <link rel="stylesheet" href="/math-app/css/style.css?v=20260919-fraction-input-1">
</head>
<body>
    <div class="page-container">
        <!-- Navigation -->
        <nav class="navbar" id="navbar">
            <div class="navbar-brand">
                <img src="/math-app/images/logo.png" alt="校徽" class="logo-img" data-i18n-attr="alt:m.logoAlt">
                <span data-i18n="m.appName">杯澳四則特訓</span>
            </div>
            <ul class="navbar-nav">
                <li><a href="/math" style="color:var(--text-primary); font-size:1rem; text-decoration:none; font-weight:600; padding:8px 16px; border-radius:8px;" data-i18n="m.home">🏠 回主頁</a></li>
            </ul>
            <div class="navbar-user">
                <span id="student-name" data-i18n="m.loading">載入中...</span>
                <div class="avatar" id="student-avatar">?</div>
            </div>
        </nav>

        <!-- Main Quiz Area -->
        <div class="main-content">
            <!-- Loading State -->
            <div id="loading-state">
                <div class="loading-spinner"></div>
                <p style="text-align:center; color: var(--text-muted);" data-i18n="m.preparing">正在準備題目...</p>
            </div>

            <!-- Quiz Active State -->
            <div id="quiz-state" style="display:none;">
                <!-- Header: Progress + Timer -->
                <div class="quiz-header">
                    <div class="quiz-progress">
                        <span class="progress-text" id="progress-text"></span>
                        <div class="progress-bar-container">
                            <div class="progress-bar-fill" id="progress-bar"></div>
                        </div>
                    </div>
                    <div class="quiz-timer">
                        <span class="timer-icon">⏱️</span>
                        <span class="timer-value" id="timer-value">0</span>
                        <span style="color: var(--text-muted); font-size:0.8rem;" data-i18n="m.seconds">秒</span>
                    </div>
                </div>

                <!-- Question Dots -->
                <div class="quiz-dots" id="quiz-dots"></div>

                <!-- Question Card -->
                <div class="quiz-question-card glass-card-static" id="question-card">
                    <div class="quiz-interaction">
                        <div class="quiz-prompt">
                            <div class="question-number" id="question-number"></div>
                            <div class="question-tag" id="question-tag">
                                <span>📐</span>
                                <span id="question-tag-text"></span>
                            </div>
                            <div class="question-category" id="question-category"></div>
                            <div class="question-text" id="question-text">23 + 45</div>
                            <div class="answer-input-wrapper">
                                <span class="equals-sign">=</span>
                                <input type="text" class="answer-input" id="answer-input"
                                       placeholder="?" autocomplete="off" inputmode="none" readonly
                                       aria-readonly="true" data-i18n-attr="aria-label:m.answerDisplay">
                                <div class="fraction-answer-fields" id="fraction-answer-fields" hidden>
                                    <input type="text" class="answer-input fraction-part" id="fraction-numerator-input"
                                           placeholder="?" autocomplete="off" inputmode="none" readonly
                                           aria-label="分子">
                                    <span class="fraction-divider" aria-hidden="true">/</span>
                                    <input type="text" class="answer-input fraction-part" id="fraction-denominator-input"
                                           placeholder="?" autocomplete="off" inputmode="none" readonly
                                           aria-label="分母">
                                </div>
                            </div>
                        </div>
                        <div class="answer-entry">
                        <div class="number-keypad" id="number-keypad" role="group"
                             data-i18n-attr="aria-label:m.numberKeypad">
                            <button type="button" class="keypad-key" data-key="1">1</button>
                            <button type="button" class="keypad-key" data-key="2">2</button>
                            <button type="button" class="keypad-key" data-key="3">3</button>
                            <button type="button" class="keypad-key" data-key="4">4</button>
                            <button type="button" class="keypad-key" data-key="5">5</button>
                            <button type="button" class="keypad-key" data-key="6">6</button>
                            <button type="button" class="keypad-key" data-key="7">7</button>
                            <button type="button" class="keypad-key" data-key="8">8</button>
                            <button type="button" class="keypad-key" data-key="9">9</button>
                            <button type="button" class="keypad-key keypad-action keypad-backspace" data-key="backspace"
                                    data-i18n-attr="aria-label:m.backspace" aria-label="刪除上一位">⌫</button>
                            <button type="button" class="keypad-key" data-key="0">0</button>
                            <button type="button" class="keypad-key keypad-submit" id="submit-answer-btn" data-key="submit"
                                    data-i18n-attr="aria-label:m.confirm">
                                <span aria-hidden="true">↵</span>
                                <span data-i18n="m.confirm">確認</span>
                            </button>
                        </div>
                        <p class="keypad-hint" data-i18n="m.keypadHint">請按數字鍵輸入答案</p>
                        </div>
                    </div>
                </div>

                <!-- Canvas Sketchpad -->
                <div class="sketchpad-container glass-card-static">
                    <div class="sketchpad-header">
                        <span style="color:var(--text-muted); font-size:0.9rem;" data-i18n="m.scratchpad">📝 計算紙 (用手指或滑鼠書寫)</span>
                        <div class="sketchpad-tools">
                            <button class="btn btn-ghost" id="grid-toggle-btn" aria-pressed="false" data-i18n="m.gridToggle">▦ 方格</button>
                            <button class="btn btn-ghost" id="hint-btn" data-i18n="m.hintBtn">💡 直式提示</button>
                            <button class="btn btn-ghost" id="clear-canvas-btn" data-i18n="m.clearCanvas">🗑️ 清除草稿</button>
                        </div>
                    </div>
                    <!-- The grid and the 直式 hint live on their own layer, so 清除草稿 wipes the
                         child's working without taking the paper away with it. -->
                    <div class="sketchpad-surface">
                        <canvas id="scratchpad-guide" aria-hidden="true"></canvas>
                        <canvas id="scratchpad"></canvas>
                    </div>
                </div>
            </div>

            <!-- Results State -->
            <div id="results-state" style="display:none;">
                <div class="results-container">
                    <div class="results-hero glass-card-static">
                        <div class="results-score" id="results-score">0%</div>
                        <div class="results-label" id="results-label" data-i18n="m.resultsLabel">本次練習正確率</div>
                    </div>

                    <div class="results-stats">
                        <div class="result-stat-card glass-card-static">
                            <div class="result-stat-value" id="stat-correct" style="color:var(--accent-green);">0</div>
                            <div class="result-stat-label" data-i18n="m.statCorrect">答對</div>
                        </div>
                        <div class="result-stat-card glass-card-static">
                            <div class="result-stat-value" id="stat-incorrect" style="color:var(--accent-red);">0</div>
                            <div class="result-stat-label" data-i18n="m.statIncorrect">答錯</div>
                        </div>
                        <div class="result-stat-card glass-card-static">
                            <div class="result-stat-value" id="stat-time" style="color:var(--accent-cyan);">0s</div>
                            <div class="result-stat-label" data-i18n="m.statTime">平均用時</div>
                        </div>
                    </div>

                    <div class="results-detail glass-card-static" id="results-detail">
                        <!-- Result items filled by JS -->
                    </div>

                    <div class="results-actions">
                        <button class="btn btn-primary btn-lg" id="retry-btn" data-i18n="m.retry">🔄 再練習一組</button>
                        <button class="btn btn-ghost btn-lg" onclick="location.href='/math'" data-i18n="m.home">🏠 回主頁</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Feedback Overlay -->
    <div class="feedback-overlay" id="feedback-overlay">
        <div class="feedback-icon" id="feedback-icon">✅</div>
    </div>

    <script src="/math-app/js/quiz.js?v=20260919-fraction-input-1"></script>
</body>
</html>
